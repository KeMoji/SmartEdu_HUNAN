  <link rel="stylesheet" href="./channel-navigation.css">

  <style>
    :root { --blue:#1e62ec; --blue-soft:#edf4ff; --ink:#202833; --muted:#7c8794; --line:#e6eaf0; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-width:1100px; color:var(--ink); background:#eef1f5; font-family:"Microsoft YaHei","微软雅黑",Arial,sans-serif; }
    body { min-height:100vh; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    .reader-page { min-height:calc(100vh - 126px); padding:16px 20px 32px; }
    .detail-breadcrumb { width:100%; max-width:1370px; margin:0 auto 16px; }
    .reader-shell { width:100%; max-width:1370px; margin:0 auto; overflow:hidden; border-radius:8px; background:#fff; box-shadow:0 3px 14px rgba(25,54,91,.06); }
    .detail-head { min-height:0; padding:18px 28px 16px; background:#fff; }
    .detail-head-top { display:flex; align-items:flex-start; justify-content:space-between; gap:30px; }
    .detail-title-wrap { min-width:0; }
    .detail-title { margin:0; color:#1d2733; font-size:20px; font-weight:700; line-height:30px; }
    .detail-meta-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px 32px; margin-top:17px; color:#7b8592; font-size:12px; }
    .detail-subtitle { display:flex; align-items:center; flex-wrap:wrap; gap:0 32px; color:#8c96a2; font-size:14px; line-height:20px; }
    .detail-subtitle span { display:inline-flex; align-items:center; white-space:nowrap; }
    .detail-subtitle .publisher-icon { width:16px; height:16px; margin-right:6px; color:#8c96a2; }
    .rating { display:inline-flex; align-items:center; gap:7px; }
    .rating-stars { display:inline-flex; align-items:center; gap:2px; line-height:16px; }
    .rating-stars svg { width:16px; height:16px; fill:#ffad28; }
    .rating-score { color:#8c96a2; }
    .detail-top-actions { display:flex; flex:0 0 auto; align-items:center; gap:12px; padding-top:1px; }
    .detail-button { height:36px; padding:0 12px; display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; border-radius:18px; font-size:13px; white-space:nowrap; }
    .detail-button svg { width:14px; height:14px; fill:currentColor; }
    .detail-button.secondary { color:#4d81e8; border-color:#d9e6ff; background:#f5f8ff; }
    .detail-button.primary { color:#fff; border-color:var(--blue); background:var(--blue); }
    .detail-button:hover { filter:brightness(.97); }
    .package-summaryline { min-height:58px; padding:8px 0; display:flex; align-items:center; justify-content:space-between; gap:24px; color:#7b8592; font-size:12px; }
    .course-actions { display:flex; align-items:center; gap:16px; white-space:nowrap; }
    .course-actions .rating-stars { color:#ffc400; font-size:16px; letter-spacing:0; }
    .course-metric,.course-action { display:inline-flex; align-items:center; gap:8px; border:0; color:#7b8592; background:transparent; font:inherit; }
    .course-action { padding:2px 0; cursor:pointer; }
    .course-action:hover,.course-action.is-active { color:var(--blue); }
    .course-action-icon { flex:0 0 16px; width:16px; height:16px; display:block; fill:currentColor; }
    .course-action-icon path { fill:currentColor; stroke:none; }
    .course-rating-stars { display:inline-flex; align-items:center; color:#ffc400; font-size:16px; letter-spacing:0; line-height:16px; }
    .reader-area { position:relative; height:1045px; overflow:hidden; border-top:1px solid #eff2f5; background:#eceef1; }
    .reader-viewport { position:absolute; top:0; right:auto; bottom:auto; left:0; width:100%; height:1000px; display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:16px 22px 24px; background:#e9ebee; }
    .book-page { display:block; width:auto; height:auto; max-width:calc(100% - 20px); margin:0 auto; transform-origin:top center; box-shadow:0 0 0 1px rgba(43,53,65,.05), 0 10px 22px rgba(25,37,53,.14); user-select:none; }
    .reader-toolbar { position:absolute; right:0; bottom:0; left:0; z-index:2; height:44px; display:flex; align-items:center; padding:0 10px; color:#e6eaed; background:#101616; font-size:13px; }
    .toolbar-group { display:flex; align-items:center; gap:8px; }
    .toolbar-spacer { flex:1; }
    .toolbar-button { width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; padding:0; border:0; border-radius:3px; color:#e4e8eb; background:transparent; }
    .toolbar-button:hover { color:#fff; background:#2b3335; }
    .toolbar-button svg { width:17px; height:17px; fill:currentColor; }
    .page-input { width:41px; height:24px; padding:0 4px; border:1px solid #4f595c; border-radius:2px; color:#f4f6f7; background:#293033; font-size:12px; text-align:center; outline:0; }
    .page-input:focus { border-color:#69a1ff; }
    .page-total,.zoom-value { color:#e7eaec; font-size:12px; white-space:nowrap; }
    .zoom-value { min-width:50px; text-align:center; }
    .fit-select { height:30px; padding:0 8px; border:0; border-left:1px solid #3b4547; color:#e6eaed; background:#293033; font-size:12px; outline:0; }
    .reader-tip { position:absolute; top:50%; left:50%; display:none; color:#7a858f; transform:translate(-50%,-50%); }
    .site-footer { min-width:1100px; padding:30px 0; color:#fff; background:#333; font-size:14px; }
    .site-footer p { margin:0; line-height:25px; text-align:center; }
    .site-footer a { color:#fff; }
    .detail-toast { position:fixed; right:24px; bottom:24px; z-index:8000; padding:10px 16px; border-radius:4px; color:#fff; background:rgba(28,39,52,.9); font-size:13px; opacity:0; pointer-events:none; transform:translateY(8px); transition:opacity .2s,transform .2s; }
    .detail-toast.show { opacity:1; transform:translateY(0); }
    .reader-area:fullscreen { width:100vw; height:100vh; border:0; }
    .reader-area:fullscreen .reader-viewport { top:0; right:0; bottom:44px; left:0; width:auto; height:auto; }
    @media (max-width:1250px) {
      html, body { min-width:0; }
      .reader-page { padding-right:14px; padding-left:14px; }
      .detail-head { padding-right:20px; padding-left:20px; }
    }
    @media (max-width:760px) {
      .detail-head-top { display:block; }
      .detail-top-actions { margin-top:16px; }
      .reader-area { height:520px; }
      .reader-viewport { height:475px; }
    }
  </style>

  <div class="detail-toast" id="detail-toast" role="status" aria-live="polite"></div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var title = params.get('title');
      var publisher = params.get('publisher') || params.get('institution');
      var cover = params.get('cover');
      var titleNode = document.getElementById('book-title');
      var publisherNode = document.getElementById('book-publisher');
      var page = document.getElementById('book-page');
      if (title) { titleNode.textContent = title; document.title = title + ' - 电子教材详情'; }
      if (publisher) publisherNode.textContent = publisher.replace(/^[♜\s]+/, '');
      if (cover && /^\.\/xiangtan-channel\/_nuxt\/img\/[\w.\-]+$/.test(cover)) page.src = cover;

      var toast = document.getElementById('detail-toast');
      var toastTimer;
      function showToast(message) {
        toast.textContent = message; toast.classList.add('show'); window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () { toast.classList.remove('show'); }, 1800);
      }
      document.querySelectorAll('.js-toast').forEach(function (button) { button.addEventListener('click', function () { showToast(button.dataset.message || '操作完成'); }); });
      document.querySelectorAll('.js-toggle').forEach(function (button) { button.addEventListener('click', function () { button.classList.toggle('is-active'); showToast(button.classList.contains('is-active') ? button.dataset.message : '已取消操作'); }); });
      var readerArea = document.getElementById('reader-area');
      var viewport = document.getElementById('reader-viewport');
      var pageInput = document.getElementById('page-input');
      var zoomValue = document.getElementById('zoom-value');
      var scale = 1;
      function syncReaderHeight() {
        if (document.fullscreenElement === readerArea) {
          readerArea.style.height = '100vh';
          return;
        }
        readerArea.style.height = window.innerWidth <= 760 ? '520px' : '1045px';
      }
      function setScale(next) { scale = Math.max(.55, Math.min(1.6, next)); page.style.width = (scale * 650) + 'px'; zoomValue.textContent = Math.round(scale * 100) + '%'; }
      function setPage(value) { var current = Math.max(1, Math.min(70, Number(value) || 1)); pageInput.value = current; showToast('已切换至第' + current + '页'); }
      document.getElementById('prev-page').addEventListener('click', function () { setPage(Number(pageInput.value) - 1); });
      document.getElementById('next-page').addEventListener('click', function () { setPage(Number(pageInput.value) + 1); });
      pageInput.addEventListener('change', function () { setPage(pageInput.value); });
      document.getElementById('zoom-out').addEventListener('click', function () { setScale(scale - .1); });
      document.getElementById('zoom-in').addEventListener('click', function () { setScale(scale + .1); });
      document.getElementById('fit-select').addEventListener('change', function () {
        if (this.value === 'width') setScale(Math.max(.7, Math.min(1.2, (viewport.clientWidth - 44) / 650)));
        else if (this.value === 'page') setScale(Math.max(.55, Math.min(1, (viewport.clientHeight - 24) / 918)));
        else setScale(1);
      });
      function toggleFullscreen() { if (document.fullscreenElement) document.exitFullscreen(); else if (readerArea.requestFullscreen) readerArea.requestFullscreen(); }
      document.getElementById('reader-fullscreen').addEventListener('click', toggleFullscreen);
      document.getElementById('present-button').addEventListener('click', toggleFullscreen);
      document.getElementById('thumb-toggle').addEventListener('click', function () { showToast('目录面板暂未展开'); });
      page.addEventListener('error', function () { page.style.display = 'none'; document.getElementById('reader-tip').style.display = 'block'; });
      window.addEventListener('resize', syncReaderHeight);
      document.addEventListener('fullscreenchange', syncReaderHeight);
      setScale(1);
      syncReaderHeight();
    }());
  </script>
