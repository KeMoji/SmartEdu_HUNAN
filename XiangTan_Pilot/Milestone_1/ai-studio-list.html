      var followed = new Set();
      var selectedRegion = 'all';
      var selectedSort = 'default';
      var searchTerm = '';
      var grid = document.getElementById('studio-grid');
      var dialog = document.getElementById('studio-dialog');
      var searchInput = document.getElementById('studio-search');

      function countFor(studio) { return studio.followers + (followed.has(studio.id) ? 1 : 0); }
      function formatCount(value) { return value >= 10000 ? (value / 10000).toFixed(1).replace(/\.0$/, '') + '万' : String(value); }
      function followIcon() { return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.2-4.3-8.8-8.2C1.2 6.9 7.1 3.8 12 8c4.9-4.2 10.8-1.1 8.8 3.8C19.2 15.7 12 20 12 20Z"></path></svg>'; }
      function filteredStudios() {
        var query = searchTerm.trim().toLowerCase();
        var result = studios.filter(function (studio) {
          var matchesRegion = selectedRegion === 'all' || studio.region === selectedRegion;
          var searchable = [studio.name,studio.school,studio.region,studio.focus,studio.description].join(' ').toLowerCase();
          return matchesRegion && (!query || searchable.indexOf(query) !== -1);
        });
        if (selectedSort === 'followers') result.sort(function (a,b) { return countFor(b) - countFor(a); });
        if (selectedSort === 'updated') result.sort(function (a,b) { return b.updated.localeCompare(a.updated); });
        return result;
      }
      function cardMarkup(studio) {
        var isFollowing = followed.has(studio.id);
        var resources = studio.items.slice(0, 3).map(function (item) {
          return '<li class="studio-resource-row"><img class="studio-resource-thumb" src="' + imageRoot + item.image + '" alt=""><div class="studio-resource-copy"><p class="studio-resource-title">' + item.title + '</p><div class="studio-resource-meta"><span><img class="studio-resource-meta-icon" src="' + imageRoot + 'resource-view.svg" alt="">' + item.views.replace(' 浏览', '') + '</span><span><img class="studio-resource-meta-icon" src="' + imageRoot + 'resource-like.svg" alt="">' + item.likes.replace(' 点赞', '') + '</span></div></div></li>';
        }).join('');
        return '<article class="studio-card" data-theme="' + studio.theme + '">' +
          '<div class="studio-card-header"><img class="studio-logo" src="' + imageRoot + studio.logo + '" alt="' + studio.school + '标识"><div class="studio-card-heading"><div class="studio-title-line"><h2 class="studio-title">' + studio.name + '</h2><span class="studio-region">' + studio.region + '</span></div><p class="studio-description">' + studio.description + '</p></div></div>' +
          '<ul class="studio-stats"><li><button class="follow-button' + (isFollowing ? ' is-following' : '') + '" type="button" data-follow="' + studio.id + '" aria-pressed="' + (isFollowing ? 'true' : 'false') + '"><strong>' + formatCount(countFor(studio)) + '</strong>关注</button></li><li><strong>' + studio.resources + '</strong>资源</li><li><strong>' + studio.views + '</strong>浏览</li><li><strong>' + studio.published + '</strong>发布</li></ul>' +
          '<ul class="studio-resource-list">' + resources + '</ul>' +
          '<div class="studio-card-actions"><button class="studio-open" type="button" data-open="' + studio.id + '">立即进入<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"></path></svg></button></div></article>';
      }
      function render() {
        var visible = filteredStudios();
        document.getElementById('result-count').textContent = visible.length;
        grid.innerHTML = visible.map(cardMarkup).join('') + (visible.length ? '' : '<div class="empty-state visible"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="21" cy="21" r="12"></circle><path d="m30 30 9 9M16 21h10"></path></svg><strong>没有找到符合条件的工作室</strong><span>试试其他地区或关键词</span></div>');
      }
      function renderDialog(studio) {
        dialog.setAttribute('data-theme', studio.theme);
        var logo = document.getElementById('dialog-logo');
        logo.src = imageRoot + studio.logo;
        logo.alt = studio.school + '标识';
        var resources = studio.items.map(function (item) {
          return '<li class="dialog-resource"><img src="' + imageRoot + item.image + '" alt=""><div><span class="dialog-resource-type">' + item.type + ' · ' + item.views + ' · ' + item.likes + '</span><strong>' + item.title + '</strong></div><time datetime="' + item.date + '">' + item.date + '</time></li>';
        }).join('');
        var isFollowing = followed.has(studio.id);
        document.getElementById('dialog-content').innerHTML = '<div class="dialog-title-row"><h2 id="dialog-title">' + studio.name + '</h2><span class="dialog-region">' + studio.region + '</span></div>' +
          '<p class="dialog-description">' + studio.description + '</p><div class="dialog-stats"><span><strong>' + formatCount(countFor(studio)) + '</strong>关注</span><span><strong>' + studio.members + '</strong>成员</span><span><strong>' + studio.views + '</strong>浏览量</span></div>' +
          '<h3 class="dialog-section-title">工作室动态</h3><ul class="dialog-resource-list">' + resources + '</ul>' +
          '<div class="dialog-actions"><button class="follow-button' + (isFollowing ? ' is-following' : '') + '" type="button" data-follow="' + studio.id + '" aria-pressed="' + (isFollowing ? 'true' : 'false') + '">' + followIcon() + (isFollowing ? '已关注' : '关注工作室') + '</button></div>';
      }
      function findStudio(id) { return studios.find(function (studio) { return studio.id === id; }); }
      function toggleFollow(id) {
        if (followed.has(id)) followed.delete(id); else followed.add(id);
        render();
        var studio = findStudio(id);
        if (dialog.open && studio) renderDialog(studio);
      }
      document.querySelectorAll('.region-button').forEach(function (button) {
        button.addEventListener('click', function () {
          selectedRegion = button.getAttribute('data-region');
          document.querySelectorAll('.region-button').forEach(function (item) {
            var active = item === button;
            item.classList.toggle('active', active);
            item.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
          render();
        });
      });
      document.querySelectorAll('.sort-button').forEach(function (button) {
        button.addEventListener('click', function () {
          selectedSort = button.getAttribute('data-sort');
          document.querySelectorAll('.sort-button').forEach(function (item) {
            var active = item === button;
            item.classList.toggle('active', active);
            item.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
          render();
        });
      });
      searchInput.addEventListener('input', function () { searchTerm = searchInput.value; render(); });
      document.getElementById('studio-search-form').addEventListener('submit', function (event) { event.preventDefault(); searchTerm = searchInput.value; render(); });
      grid.addEventListener('click', function (event) {
        var followButton = event.target.closest('[data-follow]');
        if (followButton) { toggleFollow(followButton.getAttribute('data-follow')); return; }
        var openButton = event.target.closest('[data-open]');
        if (!openButton) return;
        var studio = findStudio(openButton.getAttribute('data-open'));
        if (studio) { renderDialog(studio); dialog.showModal(); }
      });
      dialog.addEventListener('click', function (event) {
        if (event.target.closest('.dialog-close')) { dialog.close(); return; }
        var followButton = event.target.closest('[data-follow]');
        if (followButton) toggleFollow(followButton.getAttribute('data-follow'));
      });
      dialog.addEventListener('click', function (event) { if (event.target === dialog) dialog.close(); });
      document.querySelectorAll('.studio-page-button:not([disabled])').forEach(function (button) {
        button.addEventListener('click', function () {
          if (!/^\d+$/.test(button.textContent)) return;
          document.querySelectorAll('.studio-page-button').forEach(function (item) { item.classList.toggle('active', item === button); });
        });
      });
      render();
    }());
  </script>
